services:
  - type: web
    name: localoca-api
    runtime: docker
    plan: free
    # GitHub Actions triggers deployments only after API CI and Docker build pass.
    autoDeployTrigger: off
    dockerfilePath: ./Server/LocaLoca.Api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: LOCA_DB_CONNECTION
        sync: false
      - key: LOCA_SESSION_SECRET
        sync: false

name: API CI/CD

on:
  push:
    branches:
      - main
      - "feature/**"
      - "ci/**"
      - "refactor/**"
    paths:
      - "Server/LocaLoca.Api/**"
      - "Tests/**"
      - "database/**"
      - "global.json"
      - "render.yaml"
      - ".github/workflows/api-docker-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Server/LocaLoca.Api/**"
      - "Tests/**"
      - "database/**"
      - "global.json"
      - "render.yaml"
      - ".github/workflows/api-docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: api-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET restore, build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore API and test solution
        run: dotnet restore Tests/LocaLoca.Tests.sln

      - name: Build ASP.NET Core API
        run: dotnet build Server/LocaLoca.Api/LocaLoca.Api.csproj --configuration Release --no-restore

      - name: Run unit, API and PostgreSQL integration tests
        run: dotnet test Tests/LocaLoca.Tests.sln --configuration Release --no-restore --verbosity minimal

  docker:
    name: Build API Docker image
    runs-on: ubuntu-24.04
    needs: dotnet
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/teofobiaa/localoca-api
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build API image and publish on main
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Server/LocaLoca.Api/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Render and smoke-test
    runs-on: ubuntu-24.04
    needs:
      - dotnet
      - docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Missing GitHub Actions secret RENDER_DEPLOY_HOOK."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"

      - name: Wait for deployment and smoke-test API
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$RENDER_SERVICE_URL" ]; then
            echo "::error::Missing GitHub Actions secret RENDER_SERVICE_URL."
            exit 1
          fi

          base_url="${RENDER_SERVICE_URL%/}"
          health_ok=false
          ready_ok=false

          for attempt in $(seq 1 40); do
            curl --connect-timeout 5 --max-time 8 --silent \
              --output /tmp/health.json --write-out '%{http_code}' "$base_url/health" \
              > /tmp/health.code 2>/dev/null &
            health_pid=$!
            curl --connect-timeout 5 --max-time 8 --silent \
              --output /tmp/ready.json --write-out '%{http_code}' "$base_url/ready" \
              > /tmp/ready.code 2>/dev/null &
            ready_pid=$!
            wait "$health_pid" || true
            wait "$ready_pid" || true

            health_code=$(cat /tmp/health.code 2>/dev/null || true)
            ready_code=$(cat /tmp/ready.code 2>/dev/null || true)
            if [ "$health_code" = "200" ] && [ "$ready_code" = "200" ]; then
              health_ok=true
              ready_ok=true
              break
            fi

            echo "Smoke test attempt $attempt/40: /health=$health_code, /ready=$ready_code"
            sleep 10
          done

          if [ "$health_ok" != "true" ] || [ "$ready_ok" != "true" ]; then
            echo "::error::Render deployment did not pass /health and /ready within approximately 12 minutes."
            echo "Last /health response:"
            cat /tmp/health.json 2>/dev/null || true
            echo
            echo "Last /ready response:"
            cat /tmp/ready.json 2>/dev/null || true
            exit 1
          fi

          echo "Smoke tests passed: /health and /ready both returned HTTP 200."

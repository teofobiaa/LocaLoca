name: API Docker build

on:
  push:
    branches:
      - main
    paths:
      - "Server/LocaLoca.Api/**"
      - "global.json"
      - ".github/workflows/api-docker-build.yml"
  pull_request:
    paths:
      - "Server/LocaLoca.Api/**"
      - "global.json"
      - ".github/workflows/api-docker-build.yml"

permissions:
  contents: read

jobs:
  docker-build:
    name: Build ASP.NET Core API image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Server/LocaLoca.Api/Dockerfile
          push: false
          tags: localoca-api:ci

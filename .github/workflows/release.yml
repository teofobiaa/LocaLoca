name: Release Loca Loca

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version without v prefix (example: 1.2.0)'
        required: true
        type: string
  release:
    types: [published, edited]

permissions:
  contents: write

concurrency:
  group: loca-loca-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish stable release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release request
        id: validate
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_DRAFT: ${{ github.event.release.draft }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'release') {
            if ($env:RELEASE_IS_DRAFT -eq 'true' -or $env:RELEASE_IS_PRERELEASE -eq 'true') {
              throw 'Only published stable releases can receive installer assets.'
            }

            $tag = $env:RELEASE_TAG.Trim()
            if ($tag -notmatch '^v((0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))$') {
              throw "Invalid stable release tag: $tag. Expected vMAJOR.MINOR.PATCH, for example v1.2.0."
            }
            $version = $Matches[1]

            $tagCommit = git rev-parse ($tag + '^{commit}')
            if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:GITHUB_SHA) {
              throw "The checked-out commit does not match release tag $tag."
            }

            git fetch origin +refs/heads/main:refs/remotes/origin/main --quiet
            if ($LASTEXITCODE -ne 0) {
              throw 'Could not fetch main to validate the release commit.'
            }

            git merge-base --is-ancestor $tagCommit origin/main
            if ($LASTEXITCODE -ne 0) {
              throw "Release tag $tag must point to a commit that is part of main."
            }

            Write-Host "Building installer for published release $tag from $tagCommit."
          }
          else {
            if ($env:GITHUB_REF -ne 'refs/heads/main') {
              throw 'Manual releases must be started from the main branch.'
            }

            $version = $env:RELEASE_VERSION.Trim()
            if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
              throw "Invalid stable version: $version. Expected MAJOR.MINOR.PATCH, for example 1.2.0."
            }

            $mainRef = git ls-remote origin refs/heads/main
            if ($LASTEXITCODE -ne 0 -or -not $mainRef) {
              throw 'Could not verify the current main branch on origin.'
            }

            $mainSha = ($mainRef -split '\s+')[0]
            if ($mainSha -ne $env:GITHUB_SHA) {
              throw 'The selected commit is not the current main branch head. Start the workflow again from the latest main.'
            }

            $tag = "v$version"
            $existingTag = git ls-remote --tags origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) {
              throw 'Could not check remote Git tags.'
            }

            if (-not [string]::IsNullOrWhiteSpace(($existingTag | Out-String))) {
              throw "Tag $tag already exists. Choose a new version or publish/edit the existing GitHub Release."
            }

            Write-Host "Preparing new stable release $tag from $mainSha."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Test cloud installer mode selection (Windows PowerShell 5.1)
        shell: powershell
        run: ./tools/Test-CloudSetupMode.ps1

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $files = @(
            'tools/Install-CloudDependencies.ps1',
            'tools/Test-CloudSetupMode.ps1',
            'tools/Export-AttractionsSeed.ps1',
            'tools/Build-Windows.ps1',
            'tools/Build-Installer.ps1',
            'tools/Publish-LocalApi.ps1'
          )

          foreach ($file in $files) {
            Write-Host "Checking PowerShell syntax: $file"
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error ("{0}:{1}:{2}: {3}" -f $file, $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
              }
              throw "PowerShell syntax validation failed: $file"
            }
          }

      - name: Build application and versioned installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.version }}
        run: |
          ./tools/Build-Installer.ps1 -AppVersion $env:RELEASE_VERSION

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $installer = 'Builds/Installer/LocaLoca-Setup.exe'
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()

          "$hash  LocaLoca-Setup.exe" |
            Set-Content -Path 'Builds/Installer/SHA256SUMS.txt' -Encoding ascii

          Write-Host "SHA256: $hash"

      - name: Publish stable GitHub Release and attach installer
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.validate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.event_name == 'release' && github.event.release.name || format('Loca Loca {0}', steps.validate.outputs.tag) }}
          generate_release_notes: ${{ github.event_name == 'workflow_dispatch' }}
          make_latest: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            Builds/Installer/LocaLoca-Setup.exe
            Builds/Installer/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

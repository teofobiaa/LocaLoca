name: Windows installer

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'refactor/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Test cloud installer mode selection (Windows PowerShell 5.1)
        shell: powershell
        run: .\tools\Test-CloudSetupMode.ps1

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $files = @(
            'tools/Install-CloudDependencies.ps1',
            'tools/Test-CloudSetupMode.ps1',
            'tools/Export-AttractionsSeed.ps1',
            'tools/Build-Windows.ps1',
            'tools/Build-Installer.ps1',
            'tools/Publish-LocalApi.ps1'
          )
          foreach ($file in $files) {
            Write-Host "Checking PowerShell syntax: $file"
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error ("{0}:{1}:{2}: {3}" -f $file, $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
              }
              throw "PowerShell syntax validation failed: $file"
            }
          }

      - name: Build application and installer
        shell: pwsh
        run: .\tools\Build-Installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocaLoca-Setup
          path: Builds/Installer/LocaLoca-Setup.exe
          if-no-files-found: error

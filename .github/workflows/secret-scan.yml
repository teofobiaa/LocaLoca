name: Secret scan

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'refactor/**'
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan full Git history (redacted)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan all available Git refs with redacted findings
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --no-banner --log-opts="--all --full-history" .

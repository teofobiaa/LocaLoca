name: Secret scan

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'refactor/**'
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan full Git history (redacted)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan all available Git refs with redacted findings
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -v "$RUNNER_TEMP:/report" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --config=/repo/.gitleaks.toml --redact=100 --no-banner --report-format=json \
              --report-path=/report/gitleaks-redacted.json \
              --log-opts="--all --full-history" .
          scan_status=$?
          set -e

          report="$RUNNER_TEMP/gitleaks-redacted.json"
          if [ -f "$report" ]; then
            echo "Redacted finding metadata (no secret values):"
            jq -r '.[] | [.RuleID, .File, (.StartLine | tostring), .Commit] | @tsv' "$report"
            finding_count=$(jq 'length' "$report")
            echo "Total pattern matches: $finding_count"
            rm -f "$report"
          fi

          exit "$scan_status"

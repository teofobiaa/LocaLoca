name: Automated tests

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'refactor/**'
      - 'security/**'
      - 'test/**'
    paths:
      - 'Tests/**'
      - 'Tools/PasswordHashBenchmarks/**'
      - 'Server/LocaLoca.Api/**'
      - 'database/**'
      - 'global.json'
      - '.github/workflows/tests.yml'
      - '.github/dependabot.yml'
      - '.github/workflows/dependency-security.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automated-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (no Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build password KDF benchmark
        run: dotnet build Tools/PasswordHashBenchmarks/PasswordHashBenchmarks.csproj --configuration Release

      - name: Run unit tests
        run: dotnet test Tests/LocaLoca.Tests/LocaLoca.Tests.csproj --configuration Release --verbosity minimal --logger "trx;LogFileName=unit-tests.trx"

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trx-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: Tests/LocaLoca.Tests/TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 30

  api:
    name: API integration tests (isolated PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run API integration tests
        run: dotnet test Tests/LocaLoca.Api.Tests/LocaLoca.Api.Tests.csproj --configuration Release --verbosity normal --logger "console;verbosity=detailed" --logger "trx;LogFileName=api-tests.trx"

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trx-api-${{ github.run_id }}-${{ github.run_attempt }}
          path: Tests/LocaLoca.Api.Tests/TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 30

  database:
    name: PostgreSQL schema and migration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run database tests
        run: dotnet test Tests/LocaLoca.Database.Tests/LocaLoca.Database.Tests.csproj --configuration Release --verbosity minimal --logger "trx;LogFileName=database-tests.trx"

      - name: Upload database test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trx-database-${{ github.run_id }}-${{ github.run_attempt }}
          path: Tests/LocaLoca.Database.Tests/TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 30

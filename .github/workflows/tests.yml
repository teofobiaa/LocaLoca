name: API contract tests

on:
  push:
    branches:
      - main
      - feature/automated-tests
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-contract-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-contract-tests:
    name: API tests without external services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run API contract tests
        run: dotnet test Tests/LocaLoca.Api.Tests/LocaLoca.Api.Tests.csproj --configuration Release --logger "trx;LogFileName=api-contract-tests.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-contract-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

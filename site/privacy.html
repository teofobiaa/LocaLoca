## 1. Общие положения

Настоящая Политика конфиденциальности (далее — «Политика») определяет порядок обработки и защиты персональных данных пользователей приложения Loca Loca (далее — «Приложение»).

Политика применяется к отношениям, возникающим в связи с использованием Приложения, созданием учётной записи, прохождением аутентификации, размещением пользовательского контента и использованием социальных функций.

Оператором персональных данных является: **Шлионская Анастасия Семеновна**, контактные сведения: [**teofobia@proton.me**](mailto:teofobia@proton.me) (далее — «Оператор»).

Оператор обрабатывает персональные данные в соответствии с применимым законодательством о защите персональных данных, включая Федеральный закон Российской Федерации от 27.07.2006 № 152-ФЗ «О персональных данных», если его положения применимы к соответствующим отношениям.

Использование Приложения означает ознакомление пользователя с настоящей Политикой. Само по себе ознакомление с Политикой не заменяет согласие на обработку персональных данных в случаях, когда такое согласие требуется законодательством.

### 1.1. Основные термины и определения

Для целей настоящей Политики используются следующие термины:

- **Приложение (Loca Loca)** — программное обеспечение и связанные с ним сервисы, предоставляющие пользователям функции создания дневника посещённых мест, работы с картой, профилем и социальными возможностями.
- **Оператор** — лицо, самостоятельно или совместно с другими лицами организующее и (или) осуществляющее обработку персональных данных, а также определяющее цели обработки, состав персональных данных и действия (операции), совершаемые с ними. В рамках настоящей Политики Оператором является лицо, указанное в разделе 1.
- **Пользователь** — физическое лицо, использующее Приложение.
- **Субъект персональных данных** — физическое лицо, к которому относятся обрабатываемые персональные данные.
- **Персональные данные** — любая информация, относящаяся прямо или косвенно к определённому или определяемому физическому лицу.
- **Обработка персональных данных** — любое действие (операция) или совокупность действий (операций) с персональными данными, совершаемых с использованием средств автоматизации или без их использования, включая сбор, запись, систематизацию, хранение, уточнение, использование, передачу, блокирование, удаление и уничтожение.
- **Пользовательский контент** — материалы и сведения, которые Пользователь самостоятельно добавляет в Приложение, включая фотографии, заметки, оценки, описания и созданные им точки на карте.
- **Третьи лица** — лица, не являющиеся Пользователем или Оператором, которым персональные данные могут предоставляться в случаях, предусмотренных настоящей Политикой и законодательством.
- **Трансграничная передача персональных данных** — передача персональных данных на территорию иностранного государства органу власти иностранного государства, иностранному физическому лицу или иностранному юридическому лицу в соответствии с определением и требованиями применимого законодательства.
- **Учётная запись** — совокупность данных, относящихся к Пользователю и используемых для его идентификации и предоставления доступа к функциям Приложения.
- **Аутентификация** — проверка подлинности Пользователя, например посредством проверки введённого логина и пароля либо подтверждения входа через сторонний сервис.
- **Пароль** — секретная комбинация символов, которую Пользователь использует для подтверждения права доступа к своей учётной записи.
- **Хеширование пароля** — преобразование пароля специальным алгоритмом в результат фиксированного формата. Такое преобразование предназначено для проверки пароля без хранения его исходного значения и не предусматривает обычного обратного восстановления пароля из результата.
- **Хеш пароля** — результат хеширования пароля, который может храниться вместо исходного пароля и использоваться для проверки введённых Пользователем данных при входе. Хеш пароля не является самим паролем.
- **Пользовательская сессия** — период взаимодействия Пользователя с Приложением после успешной аутентификации, в течение которого система распознаёт его как вошедшего в учётную запись.
- **IP-адрес** — сетевой адрес устройства или точки подключения, используемый для передачи данных по интернет-протоколу. В определённых обстоятельствах IP-адрес может относиться к персональным данным.
- **OAuth** — протокол авторизации, позволяющий Приложению использовать подтверждение входа через внешний сервис, например Google, без получения пароля Пользователя от его учётной записи в этом сервисе.
- **Идентификатор** — значение, используемое для различения и распознавания определённого объекта, пользователя, сессии или запроса в информационной системе.
- **Инцидент безопасности персональных данных** — событие, повлёкшее неправомерную или случайную передачу (предоставление, распространение, доступ) персональных данных либо иное нарушение их безопасности, если такое событие подпадает под требования применимого законодательства.

Термины, не определённые в настоящем разделе, толкуются в значениях, установленных законодательством о персональных данных и иными применимыми нормативными правовыми актами.

## 2. Категории обрабатываемых персональных данных

В зависимости от используемых функций Приложения Оператор может обрабатывать следующие категории данных.

### 2.1. Данные учётной записи

При регистрации с использованием внутренней системы аутентификации могут обрабатываться:

- логин пользователя;
- отображаемое имя;
- хеш пароля.

Оператор не хранит пароль пользователя в открытом виде.

При использовании аутентификации через Google могут обрабатываться:

- уникальный идентификатор пользователя в системе Google;
- адрес электронной почты;
- отображаемое имя;
- сведения о подтверждении адреса электронной почты.

Приложение не получает и не хранит пароль пользователя от учётной записи Google.

### 2.2. Данные профиля

В зависимости от заполнения профиля могут обрабатываться:

- отображаемое имя;
- страна проживания;
- город;
- дата рождения;
- изображение профиля (аватар).

Предоставление отдельных сведений профиля может быть добровольным. Пользователь самостоятельно определяет, какие из предусмотренных Приложением сведений указывать.

### 2.3. Данные дневника и пользовательский контент

При использовании основных функций Приложения могут обрабатываться:

- сведения о посещённых достопримечательностях и других местах;
- даты посещений;
- оценки посещённых мест;
- заметки, описания и личные впечатления;
- фотографии;
- пользовательские точки на карте;
- географические координаты созданных пользователем точек.

Указанные сведения могут содержать персональные данные, если позволяют прямо или косвенно определить пользователя либо относятся к нему.

### 2.4. Данные социальных функций

При использовании социальных возможностей Приложения могут обрабатываться:

- поисковые запросы и сведения, необходимые для поиска пользователей;
- сведения об отправленных и полученных запросах на добавление в друзья;
- сведения о существующих дружеских связях;
- сведения о блокировках пользователей;
- настройки видимости профиля и пользовательской информации.

### 2.5. Технические данные

В целях обеспечения работоспособности, безопасности и защиты от злоупотреблений могут обрабатываться:

- IP-адрес;
- идентификаторы и сведения о пользовательских сессиях;
- идентификаторы запросов;
- сведения, необходимые для ограничения частоты запросов и предотвращения автоматизированных злоупотреблений;
- технические сведения, формируемые при взаимодействии с серверной инфраструктурой.

## 3. Цели обработки персональных данных

Оператор обрабатывает персональные данные для следующих целей:

1. Создание учётной записи, регистрация и аутентификация пользователей.
2. Предоставление доступа к функциям Приложения.
3. Создание и отображение пользовательского профиля.
4. Хранение и отображение дневника посещённых мест, фотографий, заметок, оценок и пользовательских точек на карте.
5. Обеспечение поиска пользователей и работы социальных функций.
6. Обеспечение взаимодействия между пользователями в рамках предусмотренных Приложением возможностей.
7. Применение настроек видимости профиля и пользовательского контента.
8. Обеспечение информационной безопасности, предотвращение несанкционированного доступа и злоупотреблений.
9. Диагностика технических ошибок, поддержание работоспособности и улучшение стабильности Приложения.
10. Исполнение обязанностей, предусмотренных применимым законодательством.

Персональные данные не должны использоваться для целей, несовместимых с целями их первоначального сбора, за исключением случаев, предусмотренных законодательством.

## 4. Правовые основания обработки

Обработка персональных данных осуществляется при наличии соответствующего правового основания.

В зависимости от конкретной цели и категории данных такими основаниями могут являться:

- согласие субъекта персональных данных;
- необходимость обработки для предоставления функций Приложения и исполнения соглашения с пользователем;
- исполнение обязанностей, возложенных на Оператора законодательством;
- иные основания, предусмотренные применимым законодательством.

Если для определённой операции обработки требуется отдельное согласие, оно запрашивается отдельно от настоящей Политики.

Согласие на обработку персональных данных не считается полученным исключительно вследствие бездействия пользователя, продолжения использования Приложения или факта ознакомления с настоящей Политикой.

## 5. Способы и действия по обработке персональных данных

Обработка персональных данных может осуществляться с использованием средств автоматизации.

В зависимости от целей обработки Оператор может выполнять следующие действия:

- сбор;
- запись;
- систематизация;
- накопление;
- хранение;
- уточнение (обновление, изменение);
- извлечение;
- использование;
- предоставление доступа;
- передача в предусмотренных случаях;
- блокирование;
- удаление;
- уничтожение.

Обработка осуществляется в объёме, необходимом для достижения заявленных целей.

## 6. Хранение и инфраструктура

Для функционирования Приложения используется серверная инфраструктура сторонних поставщиков услуг.

В частности, в инфраструктуре Приложения используются:

- Supabase — база данных PostgreSQL;
- Render — размещение серверного API;
- Cloudflare — инфраструктурные и сетевые функции;
- Google — аутентификация пользователей через Google OAuth.

Основная производственная база данных Supabase на дату последнего обновления настоящей Политики размещена в регионе EU West 1 (Ирландия).

Это означает, что персональные данные, обрабатываемые в основной базе данных, могут храниться за пределами страны проживания пользователя.

При использовании сторонних инфраструктурных сервисов отдельные технические данные могут обрабатываться соответствующими поставщиками в рамках предоставления их услуг.

Оператор не заявляет, что все данные и все операции обработки осуществляются исключительно на территории одной страны. Географическое размещение отдельных компонентов инфраструктуры и условия обработки данных определяются соответствующими поставщиками услуг.

## 7. Передача персональных данных третьим лицам

Оператор может предоставлять доступ к персональным данным третьим лицам в следующих случаях:

1. Для обеспечения работы Приложения — поставщикам инфраструктурных, серверных и иных технических услуг.
2. Для аутентификации — Google в рамках использования Google OAuth.
3. Другим пользователям Приложения — в пределах функциональности социальных возможностей и установленных настроек видимости.
4. Государственным органам — в случаях и порядке, предусмотренных применимым законодательством.

Поставщики инфраструктурных услуг могут выступать лицами, обрабатывающими персональные данные по поручению Оператора, либо самостоятельно определять цели и способы обработки в отношении отдельных операций, если это предусмотрено характером соответствующей услуги и применимым законодательством.

### 7.1. Запрет продажи и использования персональных данных в рекламных целях

Оператор не продаёт, не сдаёт в аренду и не предоставляет персональные данные Пользователей третьим лицам в обмен на денежное вознаграждение или иную коммерческую выгоду.

Оператор не использует персональные данные Пользователей для рекламного профилирования, подбора персонализированной рекламы или определения рекламных предпочтений.

Персональные данные не передаются рекламным сетям, рекламным платформам и иным организациям для самостоятельного использования в рекламных целях.

Передача данных поставщикам инфраструктурных и технических услуг, указанным в настоящей Политике, осуществляется в объёме, необходимом для обеспечения функционирования, безопасности и поддержки Приложения, с учётом условий предоставления соответствующих услуг и применимого законодательства.

Передача данных не означает предоставления третьим лицам неограниченного права использовать их в любых целях.

## 8. Трансграничная передача персональных данных

В связи с использованием международной инфраструктуры и предоставлением доступа к Приложению пользователям из разных стран обработка персональных данных может сопровождаться их передачей или предоставлением доступа за пределами страны проживания пользователя.

В частности, основная база данных Приложения размещена в Ирландии.

Трансграничная передача персональных данных осуществляется при наличии предусмотренных применимым законодательством оснований и с соблюдением установленных им требований.

Если к соответствующей обработке применяются требования законодательства Российской Федерации о трансграничной передаче персональных данных, Оператор обязан соблюдать предусмотренные статьёй 12 Федерального закона № 152-ФЗ требования, включая требования к предварительному уведомлению уполномоченного органа в установленных законом случаях.

## 9. Видимость профиля и пользовательского контента

Приложение предусматривает настройки видимости отдельных сведений профиля.

В зависимости от установленных настроек отдельные сведения могут быть доступны другим пользователям Приложения.

В частности, настройки по умолчанию предусматривают доступность отображаемого имени и аватара зарегистрированным пользователям. Для страны, города и даты рождения предусмотрена закрытая видимость по умолчанию.

Пользователь должен учитывать, что изменение настроек видимости может привести к предоставлению другим пользователям доступа к соответствующим сведениям.

Доступность информации другим пользователям в рамках социальных функций Приложения не означает автоматического предоставления доступа к ней неопределённому кругу лиц в открытом Интернете.

Если выбранный пользователем режим видимости предполагает распространение персональных данных в смысле применимого законодательства, такое распространение осуществляется при наличии необходимого отдельного правового основания и, когда это требуется, отдельного согласия субъекта персональных данных.

## 10. Сроки хранения персональных данных

Персональные данные хранятся не дольше, чем этого требуют цели обработки, если более продолжительный срок хранения не предусмотрен законодательством или иным применимым правовым основанием.

Сроки хранения отдельных категорий данных определяются с учётом:

- назначения соответствующих данных;
- необходимости обеспечения работы учётной записи и функций Приложения;
- необходимости обеспечения информационной безопасности;
- требований применимого законодательства;
- наличия иных законных оснований для продолжения обработки.

## 12. Защита персональных данных

Оператор принимает необходимые организационные и технические меры для защиты персональных данных от неправомерного или случайного доступа, уничтожения, изменения, блокирования, копирования, предоставления, распространения, а также от иных неправомерных действий.

К таким мерам относятся средства аутентификации, разграничение доступа, технические механизмы защиты серверной инфраструктуры и меры по предотвращению злоупотреблений.

При этом ни один способ передачи или хранения информации в информационных системах не может гарантировать абсолютную безопасность.

В случае установления факта неправомерной или случайной передачи (предоставления, распространения, доступа) персональных данных, повлекшей нарушение прав субъектов персональных данных, Оператор уведомляет уполномоченный орган по защите прав субъектов персональных данных — Роскомнадзор — в сроки, предусмотренные частью 3.1 статьи 21 Федерального закона № 152-ФЗ:

- **в течение 24 часов** с момента выявления инцидента — о произошедшем инциденте, предполагаемых причинах и вреде, принятых мерах по устранению последствий, а также о лице, уполномоченном взаимодействовать с Роскомнадзором;
- **в течение 72 часов** с момента выявления инцидента — о результатах внутреннего расследования и, при наличии, о лицах, действия которых стали причиной инцидента.

Эти сроки являются обязанностью Оператора перед уполномоченным органом и не устанавливают срок или безусловную обязанность уведомления каждого пользователя. Вопрос об информировании затронутых пользователей решается с учётом характера инцидента и требований применимого законодательства.

  <script>
    (() => {
      const source = document.getElementById("privacy-source").textContent.trim();
      const target = document.getElementById("privacy-content");
      const escapeHtml = value => value.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      const inline = value => {
        let text = escapeHtml(value);
        text = text.replace(/\[([^\]]+)\]\((mailto:[^)]+)\)/g, '<a href="$2">$1</a>');
        text = text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        return text;
      };
      const lines = source.split(/\r?\n/);
      const output = [];
      let paragraph = [];
      let listType = null;
      const closeList = () => {
        if (listType) output.push(listType === "ul" ? "</ul>" : "</ol>");
        listType = null;
      };
      const flushParagraph = () => {
        if (paragraph.length) output.push("<p>" + inline(paragraph.join(" ")) + "</p>");
        paragraph = [];
      };
      for (const line of lines) {
        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        const bullet = line.match(/^-\s+(.+)$/);
        const numbered = line.match(/^\d+\.\s+(.+)$/);
        if (!line.trim()) {
          flushParagraph();
          closeList();
        } else if (heading) {
          flushParagraph();
          closeList();
          const level = heading[1].length;
          output.push("<h" + level + ">" + inline(heading[2]) + "</h" + level + ">");
        } else if (bullet || numbered) {
          flushParagraph();
          const nextType = bullet ? "ul" : "ol";
          if (listType !== nextType) {
            closeList();
            output.push(nextType === "ul" ? "<ul>" : "<ol>");
            listType = nextType;
          }
          output.push("<li>" + inline((bullet || numbered)[1]) + "</li>");
        } else {
          closeList();
          paragraph.push(line.trim());
        }
      }
      flushParagraph();
      closeList();
      target.innerHTML = output.join("\n");
    })();
  </script>
